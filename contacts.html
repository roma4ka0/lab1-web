<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Контакти та форма зворотного зв'язку">
  <title>Контакти</title>
  <link rel="icon" href="assets/images/favicon.ico">
</head>
<body>

  <a class="skip-link" href="#main">Перейти до основного контенту</a>

  <header>
    <h1>Мій перший сайт</h1>
    <nav aria-label="Головна навігація">
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="about.html">Про нас</a></li>
        <li><a href="contacts.html" aria-current="page">Контакти</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h2>Зв'яжіться з нами</h2>

    <!-- ФОРМА -->
    <form action="#" method="post">

      <!-- Ім'я -->
      <div>
        <label for="name">Ім'я *</label><br>
        <input 
          type="text"
          id="name"
          name="name"
          placeholder="Ваше ім'я"
          required
          minlength="2"
          maxlength="40"
          pattern="[A-Za-zА-Яа-яЇїІіЄєҐґ' -]+"
          title="Допускаються лише літери"
        >
      </div>

      <br>

      <!-- Email -->
      <div>
        <label for="email">Email *</label><br>
        <input 
          type="email"
          id="email"
          name="email"
          placeholder="example@gmail.com"
          required
        >
      </div>

      <br>

      <!-- Телефон -->
      <div>
        <label for="phone">Телефон *</label><br>
        <input 
          type="tel"
          id="phone"
          name="phone"
          placeholder="+380XXXXXXXXX"
          required
          pattern="\+380[0-9]{9}"
          title="Формат: +380XXXXXXXXX"
        >
      </div>

      <br>

      <!-- Повідомлення -->
      <div>
        <label for="message">Повідомлення</label><br>
        <textarea 
          id="message"
          name="message"
          rows="4"
          maxlength="500"
          placeholder="Ваше повідомлення">
        </textarea>
      </div>

      <br>

      <!-- Кнопка -->
      <div>
        <button type="submit">Надіслати</button>
      </div>

    </form>

    <hr>

    <!-- КОНТАКТНА ІНФОРМАЦІЯ -->
    <section>
      <h3>Наші контакти</h3>
      <p><strong>Email:</strong> example@gmail.com</p>
      <p><strong>Телефон:</strong> +380000000000</p>
      <p><strong>Адреса:</strong> м. Ваше місто</p>
    </section>

    <!-- СОЦМЕРЕЖІ -->
    <aside>
      <h3>Ми в соцмережах</h3>
      <ul>
        <li><a href="https://facebook.com" target="_blank">Facebook</a></li>
        <li><a href="https://instagram.com" target="_blank">Instagram</a></li>
        <li><a href="https://t.me" target="_blank">Telegram</a></li>
      </ul>
    </aside>

  </main>

  <footer>
    <p>© 2025. Виконав: Твоє ім’я</p>
  </footer>

</body>
</html>
